services:
  mysql:
    image: mysql:8.4
    container_name: tcg-cinema-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cinema_dev_password
      MYSQL_DATABASE: tcg_cinema
    ports:
      - "4000:3306"
    volumes:
      - cinema_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
volumes:
  cinema_mysql:
