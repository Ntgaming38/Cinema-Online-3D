<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Nền vuông bo góc lớn -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#bgGrad)" />

  <!-- Vòng quỹ đạo cyan ôm quanh nút Play -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#67e8f9" stroke-width="6" opacity="0.9" filter="url(#glow)" />

  <!-- Chấm tròn nhỏ trên quỹ đạo -->
  <circle cx="256" cy="106" r="14" fill="#67e8f9" filter="url(#glow)" />

  <!-- Nút Play trắng ở giữa (tam giác) -->
  <circle cx="256" cy="256" r="66" fill="rgba(255,255,255,0.16)" />
  <polygon points="228,220 296,256 228,292" fill="#ffffff" />

  <!-- Viền khup nhẹ -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4" />
</svg>
